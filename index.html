<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Advanced Chess</title>

    <!-- REQUIRED: jQuery (MUST be first) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Chessboard CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"
    />

    <style>
      body {
        text-align: center;
        font-family: Arial;
      }
      #board {
        width: 500px;
        margin: 20px auto;
      }
      #status {
        margin-top: 10px;
        font-size: 18px;
      }
      #controls {
        margin-top: 15px;
        padding: 15px;
        background-color: #f5f5f5;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .options-row {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #new-game, #random-puzzle {
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
      }
      #time-select {
        padding: 6px 8px;
        font-size: 16px;
      }
      .timer-display {
        display: flex;
        gap: 30px;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        margin-top: 10px;
      }
      .player-timer {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .player-timer .label {
        font-size: 14px;
        font-weight: normal;
        margin-bottom: 5px;
      }
      .player-timer .time {
        font-size: 24px;
        min-width: 80px;
        text-align: center;
      }
      .player-timer.warning .time {
        color: #ff6600;
      }
      .player-timer.expired .time {
        color: #cc0000;
      }
      .puzzle-info {
        font-style: italic;
        margin-top: 10px;
        font-size: 14px;
        color: #666;
      }
      .user-info {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 14px;
        text-align: right;
      }
      .user-display {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .user-rating {
        color: #0066cc;
        font-weight: bold;
      }
      #logout-btn {
        margin-top: 5px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #signup-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      #signup-modal.active {
        display: flex;
      }
      .signup-form {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        min-width: 300px;
      }
      .signup-form h3 {
        margin-top: 0;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .form-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .form-buttons button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .form-section {
        display: none;
      }
      .form-section.active {
        display: block;
      }
      .tab-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
      }
      .tab-buttons button {
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        background-color: #ddd;
        border: none;
        border-radius: 4px;
      }
      .tab-buttons button.active {
        background-color: #0066cc;
        color: white;
      }
      #controls button {
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
      }
      .multiplayer-section {
        margin-top: 10px;
        padding: 10px;
        background-color: #e8f4f8;
        border-radius: 4px;
        display: none;
      }
      .multiplayer-section.active {
        display: block;
      }
      .multiplayer-section input, .multiplayer-section button {
        margin: 5px;
        padding: 6px 12px;
        font-size: 14px;
      }
      .game-code {
        font-weight: bold;
        color: #0066cc;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <div class="user-info" id="user-info"></div>
    <h2>♟️ Advanced Chess Game</h2>
    
    <div id="signup-modal">
      <div class="signup-form">
        <h3>User Signup / Login</h3>
        
        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div class="form-section active" id="login-section">
          <div class="form-group">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" placeholder="Enter username">
          </div>
          <div class="form-buttons">
            <button id="login-submit-btn" type="button">Login</button>
            <button id="modal-close-btn" type="button">Cancel</button>
          </div>
        </div>

        <!-- Signup Form -->
        <div class="form-section" id="signup-section">
          <div class="form-group">
            <label for="signup-username">Username:</label>
            <input type="text" id="signup-username" placeholder="Enter username">
          </div>
          <div class="form-group">
            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" placeholder="example@email.com">
          </div>
          <div class="form-buttons">
            <button id="send-code-btn" type="button">Send Verification Code</button>
          </div>
        </div>

        <!-- Verification Code Form -->
        <div class="form-section" id="verify-section" style="display: none;">
          <p>A verification code has been sent to your email.</p>
          <div class="form-group">
            <label for="verify-code">Verification Code:</label>
            <input type="text" id="verify-code" placeholder="Enter 6-digit code">
          </div>
          <div class="form-buttons">
            <button id="verify-btn" type="button">Verify & Sign Up</button>
            <button id="back-signup-btn" type="button">Back</button>
          </div>
        </div>
      </div>
    </div>

    <div id="board"></div>
    <div id="status">Loading...</div>
    <div id="controls">
      <div class="options-row">
        <button id="new-game" type="button">New Game</button>
        <button id="multiplayer-btn" type="button">Online Multiplayer</button>
        <button id="random-puzzle" type="button">Random Puzzle</button>
        <span>
          <label for="time-select">Time per player:</label>
          <select id="time-select">
            <option value="0">No Limit</option>
            <option value="60">1 Minute</option>
            <option value="180">3 Minutes</option>
            <option value="300">5 Minutes</option>
            <option value="600">10 Minutes</option>
          </select>
        </span>
      </div>
      <div class="multiplayer-section" id="multiplayer-section">
        <div>
          <h4>Online Multiplayer</h4>
          <button id="create-game-btn" type="button">Create Game</button>
          <span style="margin: 0 10px;">OR</span>
          <input type="text" id="join-code-input" placeholder="Enter game code" style="width: 150px;">
          <button id="join-game-btn" type="button">Join Game</button>
        </div>
        <div id="game-code-display" style="margin-top: 10px; display:none;">
          <p>Share this code: <span class="game-code" id="game-code"></span></p>
          <p id="waiting-msg" style="font-style: italic; color: #666;">Waiting for opponent...</p>
        </div>
      </div>
      <div class="timer-display">
        <div class="player-timer" id="white-timer">
          <div class="label">White</div>
          <div class="time" id="white-time"></div>
        </div>
        <div class="player-timer" id="black-timer">
          <div class="label">Black</div>
          <div class="time" id="black-time"></div>
        </div>
      </div>
      <div class="puzzle-info" id="puzzle-info"></div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <!-- Use OLD stable chess.js (no module issues) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>

    <script>
      $(document).ready(function () {
        var currentUser = null;
        var game = new Chess();
        var isPuzzleMode = false;
        var isMultiplayer = false;
        var multiplayerMode = false;
        var currentGameCode = null;
        var currentPlayerColor = "w";
        var timeLimitPerPlayer = 0;
        var whiteTime = 0;
        var blackTime = 0;
        var timerInterval = null;
        var gameActive = true;
        var gameStartTime = null;
        var whiteUsername = "White";
        var blackUsername = "Black";
        var verificationCode = null;

        // Email validation
        function isValidEmail(email) {
          var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return emailRegex.test(email);
        }

        function generateVerificationCode() {
          return Math.random().toString().substr(2, 6).padStart(6, '0');
        }

        function generateGameCode() {
          return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Tab switching for modal
        $(".tab-btn").on("click", function() {
          var tab = $(this).data("tab");
          $(".tab-btn").removeClass("active");
          $(this).addClass("active");
          $(".form-section").removeClass("active");
          $("#" + tab + "-section").addClass("active");
        });

        // Signup flow
        $("#send-code-btn").on("click", function() {
          var username = $("#signup-username").val().trim();
          var email = $("#signup-email").val().trim();
          
          if (!username) {
            alert("Please enter a username.");
            return;
          }
          if (!email || !isValidEmail(email)) {
            alert("Please enter a valid email address.");
            return;
          }
          
          var users = loadUsers();
          if (users[username]) {
            alert("Username already exists!");
            return;
          }
          
          verificationCode = generateVerificationCode();
          alert("Verification code sent to " + email + ": " + verificationCode);
          $(".form-section").removeClass("active");
          $("#verify-section").addClass("active");
        });

        $("#verify-btn").on("click", function() {
          var code = $("#verify-code").val().trim();
          if (code !== verificationCode) {
            alert("Invalid verification code!");
            return;
          }
          
          var username = $("#signup-username").val().trim();
          var email = $("#signup-email").val().trim();
          
          var users = loadUsers();
          users[username] = {
            email: email,
            rating: 1200,
            gamesPlayed: 0,
            wins: 0,
            losses: 0
          };
          saveUsers(users);
          setCurrentUser(username);
          
          $("#signup-username").val("");
          $("#signup-email").val("");
          $("#verify-code").val("");
          $("#signup-modal").removeClass("active");
          showUserInfo();
          alert("Welcome " + username + "! Your account is verified. Starting rating: 1200.");
        });

        $("#back-signup-btn").on("click", function() {
          $(".form-section").removeClass("active");
          $("#signup-section").addClass("active");
          verificationCode = null;
        });


        // User management functions
        function loadUsers() {
          var users = localStorage.getItem("chessUsers");
          return users ? JSON.parse(users) : {};
        }

        function saveUsers(users) {
          localStorage.setItem("chessUsers", JSON.stringify(users));
        }

        function getCurrentUser() {
          return localStorage.getItem("currentUser");
        }

        function setCurrentUser(username) {
          localStorage.setItem("currentUser", username);
        }

        function signupUser(username) {
          var users = loadUsers();
          if (users[username]) {
            alert("Username already exists!");
            return false;
          }
          users[username] = {
            rating: 1200,
            gamesPlayed: 0,
            wins: 0,
            losses: 0
          };
          saveUsers(users);
          return true;
        }

        function loginUser(username) {
          var users = loadUsers();
          if (!users[username]) {
            alert("Username not found!");
            return false;
          }
          return true;
        }

        function updateUserRating(username, won) {
          var users = loadUsers();
          if (users[username]) {
            users[username].gamesPlayed += 1;
            if (won) {
              users[username].rating += 10;
              users[username].wins += 1;
            } else {
              users[username].rating -= 10;
              users[username].losses += 1;
            }
            saveUsers(users);
          }
        }

        function showUserInfo() {
          currentUser = getCurrentUser();
          if (currentUser) {
            var users = loadUsers();
            var user = users[currentUser];
            $("#user-info").html(
              '<div class="user-display">' + currentUser + '</div>' +
              '<div class="user-rating">Rating: ' + user.rating + '</div>' +
              '<button id="logout-btn" type="button">Logout</button>'
            );
            $("#logout-btn").on("click", logoutUser);
          } else {
            $("#user-info").html('<button id="login-show-btn" type="button">Login / Signup</button>');
            $("#login-show-btn").on("click", function() {
              $("#signup-modal").addClass("active");
            });
          }
        }

        function logoutUser() {
          localStorage.removeItem("currentUser");
          currentUser = null;
          showUserInfo();
        }

        function recordGameResult(winner) {
          if (currentUser && isPuzzleMode) {
            updateUserRating(currentUser, winner === "white");
            showUserInfo();
          }
        }

        $("#login-submit-btn").on("click", function() {
          var username = $("#login-username").val().trim();
          if (!username) {
            alert("Please enter a username.");
            return;
          }
          if (loginUser(username)) {
            setCurrentUser(username);
            $("#login-username").val("");
            $("#signup-modal").removeClass("active");
            showUserInfo();
            alert("Welcome back, " + username + "!");
          }
        });

        $("#modal-close-btn").on("click", function() {
          $("#signup-modal").removeClass("active");
        });

        // Multiplayer controls
        $("#multiplayer-btn").on("click", function() {
          $("#multiplayer-section").toggleClass("active");
        });

        $("#create-game-btn").on("click", function() {
          currentGameCode = generateGameCode();
          currentPlayerColor = "w";
          isMultiplayer = true;
          multiplayerMode = true;
          gameActive = true;
          game.reset();
          board.start();
          whiteUsername = currentUser || "White";
          blackUsername = "Opponent";
          $("#game-code-display").show();
          $("#game-code").text(currentGameCode);
          $("#waiting-msg").text("Waiting for opponent to join with code: " + currentGameCode);
          updateStatus();
        });

        $("#join-game-btn").on("click", function() {
          var code = $("#join-code-input").val().trim().toUpperCase();
          if (!code) {
            alert("Please enter a game code.");
            return;
          }
          currentGameCode = code;
          currentPlayerColor = "b";
          isMultiplayer = true;
          multiplayerMode = true;
          gameActive = true;
          game.reset();
          board.start();
          whiteUsername = "Opponent";
          blackUsername = currentUser || "Black";
          $("#game-code-display").show();
          $("#game-code").text(code);
          $("#waiting-msg").text("Joined game. Waiting for opponent to move...");
          updateStatus();
        });

        // Login/Signup handlers

        var puzzlesList = [
          {
            fen: "rnbqkbnr/pppppppp/8/8/6P1/8/PPPPPP1P w KQkq - 0 1",
            description: "White to move - Avoid fool's mate"
          },
          {
            fen: "r1bqkb1r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1",
            description: "White to move - Find the winning move"
          },
          {
            fen: "r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1",
            description: "White to move - Find the move that wins material"
          },
          {
            fen: "rnbqkb1r/pppp1ppp/5n2/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 1",
            description: "White to move - Strategic advantage ahead"
          },
          {
            fen: "r1bqkbnr/ppp1pppp/2np4/3p4/2BPP3/5N2/PPP2PPP/RNBQK2R w KQkq - 0 1",
            description: "White to move - Develop and control center"
          }
        ];

        function getRandomPuzzle() {
          return puzzlesList[Math.floor(Math.random() * puzzlesList.length)];
        }

        function makeAIMove() {
          var moves = game.moves({ verbose: true });
          if (moves.length === 0) return;
          var randomMove = moves[Math.floor(Math.random() * moves.length)];
          game.move(randomMove);
          board.position(game.fen());
          updateStatus();
        }

        function formatTime(seconds) {
          var mins = Math.floor(seconds / 60);
          var secs = seconds % 60;
          return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function updateTimerDisplay() {
          $("#white-time").text(formatTime(whiteTime));
          $("#black-time").text(formatTime(blackTime));
          
          $("#white-timer").removeClass("warning expired");
          $("#black-timer").removeClass("warning expired");
          
          if (whiteTime <= 10 && whiteTime > 0) $("#white-timer").addClass("warning");
          if (blackTime <= 10 && blackTime > 0) $("#black-timer").addClass("warning");
          if (whiteTime <= 0 && timeLimitPerPlayer > 0 && whiteTime !== timeLimitPerPlayer) $("#white-timer").addClass("expired");
          if (blackTime <= 0 && timeLimitPerPlayer > 0 && blackTime !== timeLimitPerPlayer) $("#black-timer").addClass("expired");
        }

        function startTimer() {
          whiteTime = timeLimitPerPlayer;
          blackTime = timeLimitPerPlayer;
          if (timerInterval) clearInterval(timerInterval);
          if (timeLimitPerPlayer === 0) {
            $("#white-time").text("");
            $("#black-time").text("");
            return;
          }
          updateTimerDisplay();
          timerInterval = setInterval(function() {
            if (game.turn() === "w") {
              whiteTime--;
            } else {
              blackTime--;
            }
            updateTimerDisplay();
            
            if (whiteTime <= 0) {
              clearInterval(timerInterval);
              gameActive = false;
              $("#status").text("⏰ White's time expired! Black wins! Click New Game to play again.");
              recordGameResult("black");
            } else if (blackTime <= 0) {
              clearInterval(timerInterval);
              gameActive = false;
              $("#status").text("⏰ Black's time expired! White wins! Click New Game to play again.");
              recordGameResult("white");
            }
          }, 1000);
        }

        function stopTimer() {
          if (timerInterval) clearInterval(timerInterval);
        }

        function updateStatus() {
          if (!gameActive) return;
          let moveColor = game.turn() === "w" ? "White" : "Black";
          let status = moveColor + " to move";

          if (game.in_checkmate()) {
            status = "🔥 Checkmate!";
            var winner = game.turn() === "w" ? "black" : "white";
            recordGameResult(winner);
            gameActive = false;
          } else if (game.in_draw()) {
            status = "🤝 Draw!";
            gameActive = false;
          } else if (game.in_check()) {
            status += " (Check)";
          }

          $("#status").text(status);
        }

        function onDragStart(source, piece) {
          if (game.game_over() || !gameActive) return false;

          if (isPuzzleMode) {
            if (piece.startsWith("b")) return false;
          } else if (multiplayerMode) {
            var playerColor = currentPlayerColor === "w" ? "w" : "b";
            var pieceColor = piece.charAt(0);
            if (game.turn() !== playerColor) {
              alert("It's not your turn!");
              return false;
            }
          } else {
            if (
              (game.turn() === "w" && piece.startsWith("b")) ||
              (game.turn() === "b" && piece.startsWith("w"))
            ) {
              return false;
            }
          }
        }

        function onDrop(source, target) {
          var move = game.move({
            from: source,
            to: target,
            promotion: "q",
          });

          if (move === null) return "snapback";

          updateStatus();
          
          if (isPuzzleMode && gameActive) {
            setTimeout(function() {
              makeAIMove();
            }, 500);
          }
        }

        function onSnapEnd() {
          board.position(game.fen());
        }

        function startNewGame() {
          stopTimer();
          game.reset();
          board.start();
          isPuzzleMode = false;
          gameActive = true;
          $("#puzzle-info").text("");
          updateStatus();
          timeLimitPerPlayer = parseInt($("#time-select").val());
          if (timeLimitPerPlayer > 0) {
            startTimer();
          } else {
            $("#white-time").text("");
            $("#black-time").text("");
          }
        }

        function loadRandomPuzzle() {
          stopTimer();
          var puzzle = getRandomPuzzle();
          game.load(puzzle.fen);

          board.position(puzzle.fen);
          isPuzzleMode = true;
          gameActive = true;
          $("#puzzle-info").text(puzzle.description);
          updateStatus();
          timeLimitPerPlayer = parseInt($("#time-select").val());
          if (timeLimitPerPlayer > 0) {
            startTimer();
          } else {
            $("#white-time").text("");
            $("#black-time").text("");
          }
        }

        var board = Chessboard("board", {
          draggable: true,
          position: "start",
          pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd,
        });

        $("#new-game").on("click", startNewGame);
        $("#random-puzzle").on("click", loadRandomPuzzle);
        showUserInfo();
        updateStatus();
      });
    </script>
  </body>
</html>
